# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.zspell]
src_dirs = ["syllabi", "out/processor.generator.generic", "blurbs"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "config"]


[processor.checker.pyrefly]
src_dirs = ["scripts", "config"]

[processor.checker.iluacheck]
src_dirs = ["config", "print"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── web ─────────────────────────────────────────────────────────────────────

# Design-token rules (biome GritQL plugin) from the shared-themes submodule:
# this repo's stylesheets must use its var(--<role>) tokens instead of raw
# colors. The submodules are not scanned: shared-themes lints its own
# stylesheets in its own build, and its generated files (themes.css, the marp
# themes) hold the raw token values by design.
[processor.checker.biome]
src_dirs = ["site-resources", "print"]
src_extensions = [".css"]
args = ["--config-path", "shared/shared-themes/biome-tokens.jsonc"]
dep_inputs = ["shared/shared-themes/biome-tokens.jsonc", "shared/shared-themes/design-tokens.grit"]

[processor.checker.itidy]
src_dirs = ["site-resources"]
# The index pages use Material Web components (<md-outlined-select>, ...),
# which are valid HTML5 custom elements tidy only accepts with custom-tags,
# and a CSS-drawn toggle built from an empty <span>, which is valid HTML that
# tidy would otherwise warn it might trim.
options = ["custom-tags: blocklevel", "drop-empty-elements: no"]

# The submodules are not scanned here either; shared-themes lints its own
# theme-switcher.js in its own build.
[processor.checker.oxlint]
src_dirs = ["site-resources"]
args = ["-c", ".oxlintrc.repo.json"]
dep_inputs = [".oxlintrc.repo.json"]

# ─── teaching content ────────────────────────────────────────────────────────

[processor.generator.tags.syllabi]
# The vocabulary moved out of this repo into the shared-tags submodule, so
# teaching-slides and business-syllabi validate against the same lists.
# tags_dir defaults to "tags", so the new location must be named.
tags_dir = "shared/shared-tags"
src_dirs = ["syllabi", "out/processor.generator.generic"]
required_fields = ["tags", "level", "category", "audience"]
required_field_groups = [["duration_hours"], ["duration_hours_long", "duration_hours_short"]]

# Blurbs share the syllabi's vocabulary but are timed in minutes, which the
# hour-based duration lists do not cover, so they get their own instance.
[processor.generator.tags.blurbs]
tags_dir = "shared/shared-tags"
output = "out/processor.generator.tags.blurbs/tags.db"
src_dirs = ["blurbs"]
required_fields = ["tags", "level", "category", "audience", "duration_minutes"]
field_types = { duration_minutes = "number" }

[processor.checker.terms]
dir_terms_unambiguous = "shared/shared-terms/unambiguous"
dir_terms_ambiguous = "shared/shared-terms/ambiguous"
src_dirs = ["syllabi", "out/processor.generator.generic", "blurbs"]

# Every format takes its look from the shared-themes submodule: the HTML from
# themes.css (tokens), print/syllabus.css (layout) and theme-onload.js (the
# reader's palette, inlined by the Lua filter); the PDF from latex/azure.tex,
# which the Lua filter adds to the preamble; the docx from the
# docx/azure.docx reference document.
[processor.generator.pandoc.syllabi]
# rspandoc, the Rust replacement: it takes pandoc's command line
command = "rspandoc"
src_dirs = ["syllabi"]
formats = ["pdf", "html", "docx"]
output_dir = "_site"
args = ["--standalone", "--embed-resources", "--css=shared/shared-themes/themes.css", "--css=print/syllabus.css", "--lua-filter=print/pandoc_filter.lua", "--reference-doc=shared/shared-themes/docx/azure.docx"]
# xelatex because the LaTeX theme loads the token fonts with fontspec.
pdf_engine = "xelatex"
dep_inputs = [
    "shared/shared-themes/themes.css",
    "shared/shared-themes/theme-onload.js",
    "shared/shared-themes/latex/azure.tex",
    "shared/shared-themes/docx/azure.docx",
    "shared/shared-themes/fonts/Outfit-Regular.ttf",
    "shared/shared-themes/fonts/Outfit-Bold.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-Regular.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-SemiBold.ttf",
    "print/syllabus.css",
    "print/pandoc_filter.lua",
]

# Blurbs render with the same look as the syllabi, into _site/blurbs.
[processor.generator.pandoc.blurbs]
# rspandoc, the Rust replacement: it takes pandoc's command line
command = "rspandoc"
src_dirs = ["blurbs"]
formats = ["pdf", "html", "docx"]
output_dir = "_site/blurbs"
args = ["--standalone", "--embed-resources", "--css=shared/shared-themes/themes.css", "--css=print/syllabus.css", "--lua-filter=print/pandoc_filter.lua", "--reference-doc=shared/shared-themes/docx/azure.docx"]
# xelatex because the LaTeX theme loads the token fonts with fontspec.
pdf_engine = "xelatex"
dep_inputs = [
    "shared/shared-themes/themes.css",
    "shared/shared-themes/theme-onload.js",
    "shared/shared-themes/latex/azure.tex",
    "shared/shared-themes/docx/azure.docx",
    "shared/shared-themes/fonts/Outfit-Regular.ttf",
    "shared/shared-themes/fonts/Outfit-Bold.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-Regular.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-SemiBold.ttf",
    "print/syllabus.css",
    "print/pandoc_filter.lua",
]

[processor.checker.script.check_syllabus_md]
command = "scripts/check_syllabus_md.py"
src_extensions = [".md"]
src_dirs = ["syllabi", "out/processor.generator.generic"]
batch = true

# Blurbs (blurbs/) describe short talks. They are not syllabi: their agenda
# times are in minutes and visible, so they get their own format checker
# (see doc/HowToWriteBlurb.txt) and their own tags instance below.
[processor.checker.script.check_blurb_md]
command = "scripts/check_blurb_md.py"
src_extensions = [".md"]
src_dirs = ["blurbs"]
batch = true

[pages]
dir = "_site"

# ─── repo-specific configuration ────────────────────────────────────────────

# pandoc renders the PDFs with xelatex (texlive-xetex); the LaTeX theme's
# packages (fontspec, unicode-math, titlesec, colortbl) come with it and
# texlive-latex-recommended.
[dependencies]
system = ["texlive-latex-recommended", "texlive-xetex"]

[processor.generator.pandoc.generator]
# rspandoc, the Rust replacement: it takes pandoc's command line
command = "rspandoc"
src_dirs = ["out/processor.generator.generic"]
formats = ["pdf", "html", "docx"]
output_dir = "_site/tracks"
args = ["--standalone", "--embed-resources", "--css=shared/shared-themes/themes.css", "--css=print/syllabus.css", "--lua-filter=print/pandoc_filter.lua", "--reference-doc=shared/shared-themes/docx/azure.docx"]
# xelatex because the LaTeX theme loads the token fonts with fontspec.
pdf_engine = "xelatex"
dep_inputs = [
    "shared/shared-themes/themes.css",
    "shared/shared-themes/theme-onload.js",
    "shared/shared-themes/latex/azure.tex",
    "shared/shared-themes/docx/azure.docx",
    "shared/shared-themes/fonts/Outfit-Regular.ttf",
    "shared/shared-themes/fonts/Outfit-Bold.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-Regular.ttf",
    "shared/shared-themes/fonts/JetBrainsMono-SemiBold.ttf",
    "print/syllabus.css",
    "print/pandoc_filter.lua",
]

# Track yaml files generate the per-track syllabi markdown.
[processor.generator.generic]
src_dirs = ["tracks"]
src_extensions = [".yaml"]
batch = true
command = "scripts/build_tracks.py"
output_extension = "md"

[processor.explicit.generic.build_site]
command = "scripts/build_site.py"
inputs = [
    "site-resources/index_material_web.html",
    "site-resources/index_material_web.css",
    "site-resources/index_material_web.js",
    "site-resources/index_material_css.html",
    "site-resources/index_material_css.css",
    "site-resources/index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
    "shared/shared-themes/themes.json",
    "shared/shared-themes/fonts.css",
    "shared/shared-themes/shared_themes.py",
    "shared/shared-tags/level.txt",
]
input_globs = [
    "shared/shared-themes/fonts/*",
    "_site/courses/**/*.html",
    "_site/tracks/*.html",
    "_site/blurbs/*.html",
]
output_dirs = ["_site"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc", "syllabi/courses", "blurbs"]
src_files = ["CLAUDE.md", "README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["tracks"]
