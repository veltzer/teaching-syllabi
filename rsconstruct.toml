# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.generator.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]

[processor.checker.zspell]
src_dirs = ["syllabi", "out/processor.generator.generic"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "config"]


[processor.checker.mypy]
src_dirs = ["scripts", "config"]

[processor.checker.luacheck]
src_dirs = ["config", "print"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── web ─────────────────────────────────────────────────────────────────────

# Design-token rules (biome GritQL plugin) from the shared-themes submodule:
# stylesheets must use its var(--<role>) tokens instead of raw colors.
[processor.checker.biome]
src_dirs = ["site-resources", "shared", "print"]
# Generated from themes.yaml; defines the raw hex values of the --<role> tokens
# that every other stylesheet is required to use, so it cannot obey the no-hex rule.
src_exclude_paths = ["shared/shared-themes/themes.css"]
src_extensions = [".css"]
args = ["--config-path", "shared/shared-themes/biome-tokens.jsonc"]
dep_inputs = ["shared/shared-themes/biome-tokens.jsonc", "shared/shared-themes/design-tokens.grit"]

[processor.checker.tidy]
src_dirs = ["site-resources"]
# The index pages use Material Web components (<md-outlined-select>, ...),
# which are valid HTML5 custom elements tidy only accepts with custom-tags,
# and a CSS-drawn toggle built from an empty <span>, which is valid HTML that
# tidy would otherwise warn it might trim.
args = ["--custom-tags", "blocklevel", "--drop-empty-elements", "no"]

[processor.checker.oxlint]
src_dirs = ["site-resources", "shared"]
args = ["-c", ".oxlintrc.json"]

# ─── teaching content ────────────────────────────────────────────────────────

[processor.generator.tags]
# The vocabulary moved out of this repo into the shared-tags submodule, so
# teaching-slides and business-syllabi validate against the same lists.
# tags_dir defaults to "tags", so the new location must be named.
tags_dir = "shared/shared-tags"
src_dirs = ["syllabi", "out/processor.generator.generic"]
required_fields = ["tags", "level", "category", "audience"]
required_field_groups = [["duration_hours"], ["duration_hours_long", "duration_hours_short"]]

[processor.checker.terms]
dir_terms_unambiguous = "shared/shared-terms/unambiguous"
dir_terms_ambiguous = "shared/shared-terms/ambiguous"
src_dirs = ["syllabi", "out/processor.generator.generic"]

[processor.generator.pandoc.syllabi]
src_dirs = ["syllabi"]
formats = ["pdf", "html", "docx"]
output_dir = "_site"
args = ["--standalone", "--embed-resources", "--css=shared/shared-themes/themes.css", "--css=print/syllabus.css", "--lua-filter=print/pandoc_filter.lua"]
dep_inputs = ["shared/shared-themes/themes.css", "print/syllabus.css", "print/pandoc_filter.lua"]

[processor.checker.script.check_md]
command = "scripts/check_md.py"
src_extensions = [".md"]
src_dirs = ["syllabi", "out/processor.generator.generic"]
batch = true

[pages]
dir = "_site"

# ─── repo-specific configuration ────────────────────────────────────────────

[dependencies]
system = ["texlive-latex-recommended"]

[processor.generator.pandoc.generator]
src_dirs = ["out/processor.generator.generic"]
formats = ["pdf", "html", "docx"]
output_dir = "_site/tracks"
args = ["--standalone", "--embed-resources", "--css=shared/shared-themes/themes.css", "--css=print/syllabus.css", "--lua-filter=print/pandoc_filter.lua"]
dep_inputs = ["shared/shared-themes/themes.css", "print/syllabus.css", "print/pandoc_filter.lua"]

# Track yaml files generate the per-track syllabi markdown.
[processor.generator.generic]
src_dirs = ["tracks"]
src_extensions = [".yaml"]
batch = true
command = "scripts/build_tracks.py"
output_extension = "md"

[processor.explicit.generic.build_site]
command = "scripts/build_site.py"
inputs = [
    "site-resources/index_material_web.html",
    "site-resources/index_material_web.css",
    "site-resources/index_material_web.js",
    "site-resources/index_material_css.html",
    "site-resources/index_material_css.css",
    "site-resources/index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
    "shared/shared-tags/level.txt",
    "shared/shared-tags/category.txt",
    "shared/shared-tags/audiences.txt",
]
input_globs = [
    "_site/courses/**/*.html",
    "_site/tracks/*.html",
]
output_dirs = ["_site"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc", "syllabi/courses"]
src_files = ["CLAUDE.md", "README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.yamllint]
src_dirs = ["tracks"]
